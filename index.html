<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סטודיומיק - Studio Mic</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="music-toggle">
                <div class="toggle-container" id="musicToggle">
                    <div class="circle"></div>
                </div>
                <span class="music-icon">🎵</span>
            </div>
            
           <ul class="nav-links">
                <li><a href="#">בית</a></li>
                <li><a href="#">אודותיי</a></li>
                
                <li class="dropdown">
                    <a href="#">היצירות שלי ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="#">שירים</a></li>
                        <li><a href="#">פלייבקים</a></li>
                    </ul>
                </li>
                
                <li><a href="#">תמחור</a></li>
                
                <li class="dropdown">
                    <a href="#">בלוג ⚡ ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="#">מאמרים</a></li>
                        <li><a href="#">טיפים</a></li>
                    </ul>
                </li>
                
                <li><a href="#contact">צור קשר</a></li>
            </ul>

            <div class="logo">
                <img src="assets/logo.png" alt="Logo"> 
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="breadcrumbs">בית / סטודיו</div>
                <h1 class="main-title">הקול שלכם</h1>
                <h2 class="gold-title">הפלייבק המדויק</h2>
                <h3 class="thin-title">מזכרת לכל החיים</h3>
                <p class="sub-text">
                    "אולפן הקלטות בוטיק שיהפוך את הביצוע שלכם לקסם – לאירועים, למשפחה ולנשמה."
                </p>
               <a href="#" class="btn-portfolio"><span>האזינו לדוגמאות</span></a>
            </div>
        </section>
    </main>

    <audio id="myAudio" loop>
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>

    <script src="js/main.js"></script>
</body>
</html>
