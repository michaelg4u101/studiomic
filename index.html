<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סטודיומיק - Studio Mic</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav>
        <div class="logo-area">
            <div class="logo">
                <a href="#"><img src="assets/logo.png" alt="סטודיומייק לוגו"></a>
            </div>
            <div class="breadcrumbs">בית / אולפן / קריאה בחורה</div>
        </div>

        <ul class="nav-links">
            <li><a href="#">בית</a></li>
            <li><a href="#">אודותיי</a></li>
            <li class="dropdown">
                <a href="#">היצירות שלי ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="#">שירים</a></li>
                    <li><a href="#">פלייבקים</a></li>
                </ul>
            </li>
            <li><a href="#">תמחור</a></li>
            <li><a href="#">בלוג ⚡</a></li>
            <li><a href="#">צור קשר</a></li>
        </ul>

       <div class="music-wrapper">
    <span class="music-icon">♫</span> 
    <label class="switch">
        <input type="checkbox" id="music-toggle">
        <span class="slider round"></span>
    </label>
</div>
    </nav>
</header>

<main>
    <section class="hero">
        <div class="hero-content">
            <h1 class="main-title">הקול שלכם</h1>
            <h2 class="gold-title">הפלייבק המדויק</h2>
            <h3 class="thin-title">מזכרת לכל החיים</h3>
            <p class="sub-text">
                "אולפן הקלטות בוטיק שיהפוך את הביצוע שלכם לקסם – לאירועים, למשפחה ולנשמה."
            </p>
           <a href="#" class="btn-portfolio"><span>האזינו לדוגמאות</span></a>
        </div>
    </section>
</main>

<!-- נגן האודיו (לשים לפני סגירת ה-body) -->
<audio id="myAudio" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
    הדפדפן שלך לא תומך בנגן אודיו.
</audio>

<!-- קריאה לקובץ ה-JS בסוף ה-body -->
<script src="js/main.js"></script>

</body>
</html>
