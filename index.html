<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סטודיומיק - Studio Mic</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --red: #e63946;
            --black: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Heebo', sans-serif;
            background-color: #000;
            color: white;
            overflow-x: hidden;
        }

        /* רקע האתר */
        .hero-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); /* שם התמונה שלך */
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* פס התקדמות */
        #progress-bar {
            position: fixed;
            top: 0; right: 0; height: 4px;
            background: var(--gold);
            width: 0%;
            z-index: 1000;
        }

        /* תפריט עליון */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0; z-index: 100;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 400;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--gold); }

        .logo {
            width: 60px;
            height: 60px;
            transition: transform 0.8s ease-in-out;
            cursor: pointer;
        }
        .logo:hover { transform: rotate(360deg); }

        /* כפתור מוזיקה */
        .music-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px; height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444; transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--gold); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* תוכן מרכזי */
        .hero-content {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 10%;
        }

        .breadcrumbs { font-size: 14px; color: #ccc; margin-bottom: 10px; }

        h1.main-title { font-size: 70px; font-weight: 900; margin: 0; line-height: 1.1; }
        
        h2.gold-title { 
            font-size: 65px; 
            font-weight: 900; 
            color: var(--gold); 
            text-shadow: 2px 2px 0px white;
            margin: 0;
        }

        h3.thin-title { font-size: 35px; font-weight: 300; margin: 10px 0; }

        .sub-text { font-size: 20px; max-width: 500px; margin-bottom: 30px; line-height: 1.6; }

        /* הכפתור האדום עם אנימציית הזהב */
        .btn-portfolio {
            display: inline-block;
            background-color: var(--red);
            color: black;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            width: fit-content;
        }

        .btn-portfolio::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
            transition: none;
        }

        .btn-portfolio:hover::before {
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            0% { right: -100%; }
            100% { right: 100%; }
        }

    </style>
</head>
<body>

    <div id="progress-bar"></div>
    <div class="hero-bg"></div>

    <nav>
        <div class="music-toggle">
            <span>🎵</span>
            <label class="switch">
                <input type="checkbox" id="musicBtn">
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="nav-links">
            <a href="#">בית</a>
            <a href="#">אודותיי</a>
            <a href="#">היצירות שלי</a>
            <a href="#">תמחור</a>
            <a href="#">בלוג ⚡</a>
            <a href="#">צור קשר</a>
        </div>

        <img src="logo.png" alt="Logo" class="logo"> </nav>

    <div class="hero-content">
        <div class="breadcrumbs">בית / סטודיו</div>
        <h1 class="main-title">הקול שלכם</h1>
        <h2 class="gold-title">הפלייבק המדויק</h2>
        <h3 class="thin-title">מזכרת לכל החיים</h3>
        
        <p class="sub-text">
            "אולפן הקלטות בוטיק שיהפוך את הביצוע שלכם לקסם – <br>
            לאירועים, למשפחה ולנשמה."
        </p>

        <a href="#" class="btn-portfolio">האזינו לדוגמאות</a>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg"> </audio>

    <script>
        // פס התקדמות
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        };

        // הפעלת מוזיקה
        const music = document.getElementById("bgMusic");
        const btn = document.getElementById("musicBtn");

        btn.addEventListener("change", function() {
            if (this.checked) {
                music.play();
            } else {
                music.pause();
            }
        });
    </script>

</body>
</html>
